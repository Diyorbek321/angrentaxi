events { worker_connections 1024; }

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Only send `Connection: upgrade` when the client actually asked for an
    # upgrade. /manager/ serves ordinary pages and WebSockets through the same
    # location, so hardcoding "upgrade" there would mislabel every page request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend { server backend:3000; }
    upstream web_admin { server web-admin:3001; }
    upstream web_manager { server web-manager:3002; }

    # HTTP -> redirect to HTTPS (comment out in dev)
    server {
        listen 80;
        server_name _;
        # return 301 https://$host$request_uri;  # Uncomment for prod with SSL

        # Dev: serve directly over HTTP
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # WebSocket
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Admin panel
        location /admin/ {
            proxy_pass http://web_admin/;
            proxy_set_header Host $host;
        }

        # Manager panel. Carries WebSocket traffic as well as pages: the panel
        # tunnels socket.io through its own Node server (web-manager/server.js)
        # so the access token stays in an httpOnly cookie instead of being
        # handed to browser JS. That means the upgrade headers have to survive
        # this hop — without them the dispatcher board silently loses realtime.
        location /manager/ {
            proxy_pass http://web_manager/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://web_admin;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server (uncomment and configure for production)
    # server {
    #     listen 443 ssl http2;
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ...same location blocks as above...
    # }
}
