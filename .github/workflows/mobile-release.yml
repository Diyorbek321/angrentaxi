# Mobil reliz: ikkala ilova (yo'lovchi + haydovchi) imzolangan APK'lari.
#
# NEGA: ilgari APK bitta noutbukda qo'lda yig'ilardi — keystore bitta
# mashinada, build takrorlanmas, versionCode doim 1. Endi `mobile-v*` tegi
# qo'yilsa (yoki qo'lda "Run workflow") GitHub o'zi yig'adi, imzolaydi va
# APK'larni relizga biriktiradi.
#
# Kerakli GitHub sozlamalari (Settings → Secrets and variables → Actions):
#   Secrets:
#     ANDROID_KEYSTORE_BASE64   — `base64 -w0 angren-taxi-release.jks`
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS         — masalan `angren-taxi`
#     ANDROID_KEY_PASSWORD
#     MOBILE_DART_DEFINES_JSON  — mobile/.env.dart-defines.json mazmuni
#                                 (MAPTILER_KEY, SENTRY_DSN, ...)
#     SENTRY_AUTH_TOKEN         — ixtiyoriy: simvollarni Sentry'ga yuklash
#   Variables:
#     MOBILE_API_BASE_URL       — https://<domen>/api/v1
#     MOBILE_WS_URL             — https://<domen>
#     SENTRY_ORG, SENTRY_PROJECT — ixtiyoriy
#
# B reja: GitHub Actions ishlamasa — `mobile/tool/build_release.sh` lokal
# xuddi shu natijani beradi (keystore'ning oflayn nusxasi kerak).
name: Mobile release

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.32.2'

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode = commitlar soni (tool/build_release.sh) — to'liq tarix kerak.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Sirlar faylga faqat shu runner ichida yoziladi va loglarga chiqmaydi.
      - name: Write signing config and dart-defines
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DART_DEFINES_JSON: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret yo'q}"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          if [[ -n "${DART_DEFINES_JSON:-}" ]]; then
            printf '%s' "$DART_DEFINES_JSON" > .env.dart-defines.json
          fi

      - name: Build release APKs
        env:
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          WS_URL: ${{ vars.MOBILE_WS_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: tool/build_release.sh

      # Imzo haqiqiy kalit bilanmi (debug kalitga tushib qolmaganmi) —
      # build.gradle kalit topilmasa debug imzoga jim o'tadi.
      - name: Verify signature
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if "$apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "❌ $apk debug kalit bilan imzolangan" >&2
              exit 1
            fi
          done

      - name: Upload APKs and symbols
        uses: actions/upload-artifact@v4
        with:
          name: angren-taxi-${{ github.ref_name }}
          path: |
            mobile/build/app/outputs/flutter-apk/*-release.apk
            mobile/build/symbols/
          retention-days: 90

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/*-release.apk

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties .env.dart-defines.json
