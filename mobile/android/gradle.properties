org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Jetifier — AndroidX'gacha bo'lgan (support-library) bog'liqliklarni qayta
# yozish uchun. Loyihadagi plaginlarning hammasi allaqachon AndroidX, ya'ni
# u hech narsani tuzatmaydi, lekin HAR BIR jar'ni, jumladan Flutter
# dvigatelining kattalarini ham, qayta ishlaydi va build'ni "Java heap
# space" bilan yiqitadi.
android.enableJetifier=false
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
