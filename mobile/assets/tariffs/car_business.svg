       g'ildirak markazi y=37, radius 8.5 — to'rt mashina bitta yer
       chizig'ida turishi uchun.
       Biznesni ajratadigan narsa NARX yoki nishon emas, PROPORSIYA:
       eng uzun kuzov (3..117) va eng past tom (y=10, tejamkorda 7.5).
       Past va uzun siluet qimmatlik signali — buni rang bermaydi. -->

  <path d="M3 34 L3 29 C3 25 5.5 22.5 9 22 L32 19.5 L47 10 L82 10
