name: angren_taxi
description: Angren Taxi - Ride-hailing platform

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP
  dio: ^5.4.0

  # State Management
  provider: ^6.1.1

  # WebSocket
  socket_io_client: ^2.0.3+1

  # Maps
  latlong2: ^0.9.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Storage
  shared_preferences: ^2.2.2
  # Auth tokens live in the platform keystore (Android EncryptedSharedPrefs /
  # iOS Keychain), never in plaintext SharedPreferences.
  flutter_secure_storage: ^9.2.2

  # Firebase
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  get_it: ^7.6.7
  pin_code_fields: ^8.0.1

  # Premium UI: fonts + declarative micro-animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # In-app checkout (Payme/Click/Uzcard hosted payment pages)
  webview_flutter: ^4.9.0

  # Driver KYC document upload (camera / gallery picker)
  image_picker: ^1.1.2

  # Calling the driver/passenger from the trip screen (tel: deep link)
  url_launcher: ^6.3.1
  maplibre_gl: ^0.22.0

  # Haydovchi navigatsiyasidagi pog'onali ovozli ko'rsatmalar.
  # ⚠️ uz-UZ ovozi hamma qurilmada yo'q — VoiceGuide ishga tushganda
  # mavjud tillarni tekshirib, uz-UZ → ru-RU → ovozsiz tartibida
  # pasayadi (lib/core/location/voice_guide.dart).
  flutter_tts: ^4.2.5
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  mocktail: ^1.0.4
  # Faking image_picker's platform interface in widget tests (see
  # test/widget/driver_kyc_upload_test.dart).
  image_picker_platform_interface: ^2.11.1
  plugin_platform_interface: ^2.1.8
  # Faking url_launcher's platform interface in widget tests (see
  # test/widget/driver_navigation_test.dart).
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/map/
    - assets/tariffs/
